# Configuración de despliegue para Render.com
# (también funciona como Blueprint: "New +" → "Blueprint" sobre este repo)
services:
  - type: web
    name: piedra-papel-tijeras
    runtime: node
    plan: free
    buildCommand: "true"        # sin dependencias que instalar
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
